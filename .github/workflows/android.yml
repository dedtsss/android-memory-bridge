name: Android CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      publish_build_artifacts:
        description: Опубликовать APK в ограниченные CI artifacts для ручной передачи
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  lint-unit-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew lintDebug testDebugUnitTest assembleDebug assembleRelease --stacktrace
      - name: Проверить размер APK перед публикацией
        if: github.event_name == 'workflow_dispatch' && inputs.publish_build_artifacts
        run: |
          max_bytes=$((50 * 1024 * 1024))
          total_bytes=0
          for apk in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk; do
            size=$(stat -c %s "$apk")
            total_bytes=$((total_bytes + size))
          done
          if [ "$total_bytes" -gt "$max_bytes" ]; then
            echo "Combined APK artifacts exceed the 50 MiB CI artifact limit: ${total_bytes} bytes" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.publish_build_artifacts
        with:
          name: memory-bridge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.publish_build_artifacts
        with:
          name: memory-bridge-unsigned-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 3

  instrumentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          script: ./gradlew connectedDebugAndroidTest --stacktrace
